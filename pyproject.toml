[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htpasswd-cli"
version = "1.0.0"
description = "Generate Apache-style htpasswd entries (username:hash) for HTTP Basic Auth, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["htpasswd", "cli", "devtools", "auth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
htpasswd-cli = "htpasswd_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
